name: Streamlit keepalive ping (disabled by default)

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app (best effort)
        shell: bash
        run: |
          set +e
          APP_URL="https://pensieve-live.streamlit.app/"

          echo "Pinging: $APP_URL"
          code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL")
          rc=$?

          echo "curl exit code: $rc"
          echo "http status: $code"

          if [ "$rc" -ne 0 ]; then
            echo "::warning::curl failed (exit $rc). Streamlit may be asleep."
            exit 0
          fi

          if [ "$code" -ge 400 ]; then
            echo "::warning::Received HTTP $code from Streamlit."
          fi

          exit 0
