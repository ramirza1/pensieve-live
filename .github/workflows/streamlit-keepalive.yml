name: Streamlit keepalive ping

on:
  schedule:
    # Every 12 hours (00:12 and 12:12 UTC)
    - cron: "12 0 * * *"
    - cron: "12 12 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          set -e
          APP_URL="https://pensieve-live.streamlit.app/"
          # Follow redirects; retry a few times; fail if non-2xx
          curl -L --retry 3 --retry-delay 5 --fail --max-time 30 "" > /dev/null
